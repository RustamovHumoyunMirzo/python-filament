name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python API (${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.7', runner: ubuntu-22.04}
          - {python: '3.8', runner: ubuntu-24.04}
          - {python: '3.9', runner: ubuntu-24.04}
          - {python: '3.10', runner: ubuntu-24.04}
          - {python: '3.11', runner: ubuntu-24.04}
          - {python: '3.12', runner: ubuntu-24.04}
          - {python: '3.13', runner: ubuntu-24.04}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -U pip
      - run: python -m pip install numpy "pytest<8"
      - run: PYTHONPATH=src python -m pytest

  wheels:
    name: Wheel (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: AMD64, runner: windows-2022,
             build: 'cp37-* cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*',
             sdk: 'https://github.com/google/filament/releases/download/v1.76.1/filament-v1.76.1-windows.tgz'}
          - {os: macos, arch: x86_64, runner: macos-15-intel,
             build: 'cp37-* cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*',
             sdk: 'https://github.com/google/filament/releases/download/v1.76.1/filament-v1.76.1-mac.tgz'}
          - {os: macos, arch: arm64, runner: macos-15,
             build: 'cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*',
             sdk: 'https://github.com/google/filament/releases/download/v1.76.1/filament-v1.76.1-mac.tgz'}
          - {os: linux, arch: x86_64, runner: ubuntu-24.04,
             build: 'cp37-* cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*',
             sdk: 'https://github.com/google/filament/releases/download/v1.76.1/filament-v1.76.1-linux.tgz'}
          - {os: linux, arch: aarch64, runner: ubuntu-24.04-arm,
             build: 'cp37-* cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*',
             sdk: 'https://github.com/google/filament/releases/download/v1.76.1/filament-v1.76.1-arm-linux.tgz'}
          - {os: windows, arch: ARM64, runner: windows-11-arm,
             build: 'cp311-* cp312-* cp313-*',
             sdk: '${{ vars.FILAMENT_WINDOWS_ARM64_SDK_URL }}'}
    steps:
      - uses: actions/checkout@v6
        if: matrix.sdk != ''
      - uses: actions/setup-python@v6
        if: matrix.sdk != ''
        with:
          python-version: '3.13'
      - name: Download Filament SDK
        if: matrix.sdk != ''
        shell: bash
        run: curl -fL '${{ matrix.sdk }}' -o filament-sdk.tgz
      - if: matrix.sdk != ''
        run: python -m pip install cibuildwheel==2.23.3
      - name: Build wheels
        if: matrix.sdk != ''
        shell: bash
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT: FILAMENT_ARCHIVE=filament-sdk.tgz
          CIBW_ENVIRONMENT_LINUX: FILAMENT_ARCHIVE=filament-sdk.tgz CC=clang CXX=clang++ CXXFLAGS=-stdlib=libc++
          CIBW_ENVIRONMENT_MACOS: FILAMENT_ARCHIVE=filament-sdk.tgz CMAKE_ARGS=-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: dnf install -y clang libcxx-devel libcxx-static libcxxabi-static
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_TEST_COMMAND: python -c "import filament; from filament import _native; assert _native.BINDING_VERSION == filament.__version__; print(_native.FILAMENT_VERSION)"
          CIBW_TEST_REQUIRES: numpy
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v6
        if: matrix.sdk != ''
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify release version
        shell: bash
        run: python -c "import pathlib,tomllib; v=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert '${GITHUB_REF_NAME}' == 'v'+v, ('tag', '${GITHUB_REF_NAME}', 'package', v)"
      - name: Build source distribution
        run: python -m pip install build
      - name: Package source distribution
        run: python -m build --sdist --outdir dist
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: wheel-dist
          merge-multiple: true
      - name: Collect wheels
        shell: bash
        run: cp wheel-dist/*.whl dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
